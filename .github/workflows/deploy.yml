name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yoaayush/mockforge-frontend

jobs:
  build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t ghcr.io/yoaayush/mockforge-frontend:latest \
            -t ghcr.io/yoaayush/mockforge-frontend:${{ github.sha }} \
            .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/yoaayush/mockforge-frontend:latest
          docker push ghcr.io/yoaayush/mockforge-frontend:${{ github.sha }}

  deploy:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SECRET }}

          script: |
            set -e

            echo "Starting frontend deployment..."

            cd /opt/mockforge

            echo "Pulling latest frontend image..."
            sudo docker pull ghcr.io/yoaayush/mockforge-frontend:latest

            echo "Restarting frontend container..."
            sudo docker compose up -d frontend

            echo "Frontend deployment completed!"

            sudo docker compose ps frontend